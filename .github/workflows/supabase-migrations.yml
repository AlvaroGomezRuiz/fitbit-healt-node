# Aplica migraciones SQL versionadas al proyecto Supabase enlazado por ref.
# Vercel sigue desplegando solo con push a git; este job no fuerza redeploy web.

name: Supabase DB migrations

on:
  push:
    branches: [main, master]

concurrency:
  group: supabase-db-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link remote project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Push pending migrations
        run: supabase db push --linked
